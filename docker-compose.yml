services:
  backend:
    build:
      context: ./backend
    container_name: mobile-order-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  test:
    build:
      context: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && pytest -q"
